<!DOCTYPE html>
<head>
  <title>simple Calculator </title>
  <link rel="program5.html" type="text/css" href="style.css">
</head>
<body>
  <div class = "toggleBtn">
  <div class="Calculator">
  <div class="buttons">
  <h2 id="value"></h2>
  <span id="clear">clear</span>
<span>/</span>
<span>*</span>
<span>7</span>
<span>8</span>
<span>9</span>
<span>-</span>
<span>4</span>
<span>5</span>
<span>6</span>
<span>+</span>
<span>1</span>
<span>2</span>
<span>3</span>
<span>0</span>
<span>00</span>
<span>.</span>
<span id="equal"></span>
</div>
</div>
</div>
</body>
</html>

<script>
  let buttons = document.querySelector(".buttons");
  let btn = document.querySelectorAll("span");
  let value = document.getElementById("value");

 for(let i=0; i<btn.length;i++){
  btn[i].addEventListener("click", function(){

    if(this.innerHTML=="="){
      value.innerHTML = eval(value.innerHTML);
    }else{
      if(this.innerHTML=="clear"){
        value.innerHTML = "";
      }
      else{
        value.innerHTML += this.innerHTML;
      }
    } 
 } )
}
</script>
